<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quokka List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: linear-gradient(135deg, #FFF5F8 0%, #FFF0E6 50%, #F0F7FF 100%);
      font-family: 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.02em;
      position: relative;
    }

    .brand {
      position: absolute;
      top: 48px;
      left: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #FFFFFF;
      padding: 14px 28px;
      border-radius: 50px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .brand-emoji {
      font-size: 28px;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 600;
      color: #666;
    }

    .content {
      padding: 140px 60px 100px;
    }

    .title-area {
      text-align: center;
      margin-bottom: 48px;
    }

    .emoji {
      font-size: 80px;
      margin-bottom: 16px;
    }

    .headline {
      font-size: 56px;
      font-weight: 800;
      color: #2D2D2D;
      line-height: 1.3;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .list-item {
      background: #FFFFFF;
      border-radius: 32px;
      padding: 28px 36px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      transition: transform 0.2s;
    }

    .item-emoji {
      font-size: 48px;
      flex-shrink: 0;
    }

    .item-text {
      font-size: 34px;
      font-weight: 600;
      color: #333;
      line-height: 1.4;
    }

    .item-num {
      background: {{accent_color}};
      color: #FFFFFF;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .page-num {
      position: absolute;
      bottom: 48px;
      right: 48px;
      background: #FFFFFF;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: {{accent_color}};
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <div class="brand">
    <span class="brand-emoji">🧡</span>
    <span class="brand-name">@{{account_name}}</span>
  </div>

  <div class="content">
    <div class="title-area">
      <div class="emoji">{{emoji}}</div>
      <h2 class="headline">{{headline}}</h2>
    </div>

    <div class="list">
      <div class="list-item">
        <div class="item-num">1</div>
        <span class="item-text">{{item1}}</span>
      </div>
      <div class="list-item">
        <div class="item-num">2</div>
        <span class="item-text">{{item2}}</span>
      </div>
      <div class="list-item">
        <div class="item-num">3</div>
        <span class="item-text">{{item3}}</span>
      </div>
      {{#item4}}
      <div class="list-item">
        <div class="item-num">4</div>
        <span class="item-text">{{item4}}</span>
      </div>
      {{/item4}}
      {{#item5}}
      <div class="list-item">
        <div class="item-num">5</div>
        <span class="item-text">{{item5}}</span>
      </div>
      {{/item5}}
    </div>
  </div>

  <div class="page-num">{{badge_number}}</div>
</body>
</html>
