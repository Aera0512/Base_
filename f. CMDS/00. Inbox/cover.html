<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quokka Cover</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: linear-gradient(135deg, #FFF5F8 0%, #FFF0E6 50%, #F0F7FF 100%);
      font-family: 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.02em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .decoration {
      position: absolute;
      font-size: 120px;
      opacity: 0.15;
    }

    .deco-1 { top: 80px; left: 80px; }
    .deco-2 { top: 200px; right: 100px; }
    .deco-3 { bottom: 300px; left: 60px; }

    .emoji-area {
      font-size: 180px;
      margin-bottom: 40px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 72px;
      text-align: center;
    }

    .badge {
      background: {{accent_color}};
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 700;
      padding: 16px 40px;
      border-radius: 50px;
      margin-bottom: 32px;
      box-shadow: 0 8px 24px {{accent_color}}44;
    }

    .headline {
      font-size: 88px;
      font-weight: 800;
      color: #2D2D2D;
      line-height: 1.25;
      letter-spacing: -0.025em;
      word-break: keep-all;
      margin-bottom: 24px;
    }

    .subtext {
      font-size: 38px;
      font-weight: 500;
      color: #666;
      line-height: 1.6;
      word-break: keep-all;
    }

    .highlight {
      background: linear-gradient(to top, {{accent_color}}55 60%, transparent 60%);
      padding: 0 8px;
      border-radius: 8px;
    }

    .footer {
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #FFFFFF;
      padding: 16px 32px;
      border-radius: 50px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .brand-emoji {
      font-size: 32px;
    }

    .brand-name {
      font-size: 26px;
      font-weight: 600;
      color: #666;
    }

    .page-hint {
      background: #FFFFFF;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 24px;
      color: #999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

  <div class="decoration deco-1">🥰</div>
  <div class="decoration deco-2">💕</div>
  <div class="decoration deco-3">✨</div>

  <div class="emoji-area">{{emoji}}</div>

  <div class="content">
    <div class="badge">{{headline_label}}</div>
    <h1 class="headline">{{headline}}</h1>
    <p class="subtext">{{subtext}}</p>
  </div>

  <div class="footer">
    <div class="brand">
      <span class="brand-emoji">🧡</span>
      <span class="brand-name">@{{account_name}}</span>
    </div>
    <div class="page-hint">스와이프 →</div>
  </div>

</body>
</html>
