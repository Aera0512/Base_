<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1330" viewBox="0 0 1800 1330">
  <defs>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #172033; }
