  <circle cx="1260" cy="91" r="8" fill="#e65a5a"/><text x="1278" y="98" class="small">1차·1단계</text>
  <circle cx="1410" cy="91" r="8" fill="#7a263d"/><text x="1428" y="98" class="small">2차·2단계</text>
