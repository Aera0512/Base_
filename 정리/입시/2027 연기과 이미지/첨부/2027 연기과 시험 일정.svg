  <text x="92" y="672" class="school">가천 2단계</text>
  <text x="92" y="714" class="school">성균관 2단계</text>
  <text x="92" y="756" class="school">서울예대 1차</text>
  <text x="92" y="798" class="school">한예종 2차</text>
  <text x="92" y="840" class="school">동국 2단계</text>
  <text x="92" y="882" class="school">국민 2단계</text>
  <text x="92" y="924" class="school">세종 2단계</text>
  <text x="92" y="966" class="school">서울예대 2차</text>
  <text x="92" y="1008" class="school">건국 2단계</text>

