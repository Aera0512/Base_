  <rect x="1306" y="817" width="75" height="30" rx="8" fill="#7B263D"/>
  <text x="1343" y="839" text-anchor="middle" class="date" style="fill:#ffffff">10/21–25</text>
  <rect x="1351" y="859" width="30" height="30" rx="8" fill="#7B263D"/>
  <text x="1241" y="881" font-size="17" font-weight="800" fill="#7B263D">10/24–25</text>
  <rect x="1441" y="901" width="30" height="30" rx="8" fill="#7B263D"/>
  <text x="1364" y="923" font-size="17" font-weight="800" fill="#7B263D">10/30–31</text>
  <rect x="1456" y="943" width="30" height="30" rx="8" fill="#7B263D"/>
  <text x="1497" y="965" font-size="17" font-weight="800" fill="#7B263D">10/31–11/01</text>
  <rect x="1025" y="985" width="430" height="30" rx="8" fill="#ffffff" stroke="#7B263D" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="1240" y="1007" text-anchor="middle" font-size="17" font-weight="800" fill="#7B263D">2단계 실기 날짜 · 공식 공지 재확인</text>

  <!-- footer cards -->
  <rect x="92" y="1230" width="780" height="150" rx="20" fill="#fff8e9" stroke="#f2d18e" stroke-width="2"/>
  <text x="126" y="1274" font-size="22" font-weight="800" fill="#8a5b00">⚠ 충돌 우선 확인</text>
  <text x="126" y="1311" class="small">10/01–05  국민·성균관 1단계 중첩</text>
  <text x="126" y="1344" class="small">10/21–25  한예종·동국·서울예대·국민 중첩</text>

  <rect x="896" y="1230" width="812" height="150" rx="20" fill="#f2f5fa" stroke="#cfd7e6" stroke-width="2"/>
  <text x="930" y="1274" font-size="22" font-weight="800" fill="#44506a">수시 6장 확정 완료</text>
  <text x="930" y="1311" class="small">가천 · 동국 · 세종 · 국민 · 성균관 · 건국</text>
  <text x="930" y="1344" class="small">별도 확정  한국예술종합학교 · 서울예술대학교</text>

  <circle cx="105" cy="1425" r="8" fill="#E45757"/><text x="124" y="1432" class="small">확정 학교 1차·1단계</text>
  <circle cx="350" cy="1425" r="8" fill="#7B263D"/><text x="369" y="1432" class="small">확정 학교 2차·2단계</text>
  <text x="1688" y="1432" text-anchor="end" class="small">공식 모집요강 기준 · 확인 2026-08-04</text>
