  <line x1="365" y1="346" x2="365" y2="1200" stroke="#d7ddea" stroke-width="2"/>
  <line x1="559" y1="346" x2="559" y2="1200" stroke="#d7ddea" stroke-width="2"/>
  <line x1="1007" y1="346" x2="1007" y2="1200" stroke="#d7ddea" stroke-width="2"/>
  <line x1="1470" y1="346" x2="1470" y2="1200" stroke="#d7ddea" stroke-width="2"/>
  <line x1="1680" y1="346" x2="1680" y2="1200" stroke="#d7ddea" stroke-width="2"/>

