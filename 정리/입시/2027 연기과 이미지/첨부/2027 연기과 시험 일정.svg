  <text x="166" y="211" font-size="21" font-weight="800" fill="#9b302d">가장 먼저 준비할 시험 · 한국예술종합학교 1차</text>
  <text x="166" y="244" font-size="27" font-weight="800" fill="#9b302d">8월 19일(수) · 대기실 입실 마감 15시 30분</text>
