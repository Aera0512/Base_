<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540">
  <defs>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #182033; }
      .title { font-size: 48px; font-weight: 800; }
      .subtitle { font-size: 22px; fill: #65708a; }
      .month { font-size: 24px; font-weight: 800; fill: #35415e; }
      .school { font-size: 22px; font-weight: 700; }
      .date { font-size: 18px; font-weight: 700; fill: #ffffff !important; }
      .small { font-size: 18px; fill: #65708a; }
      .note { font-size: 21px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#26334f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1800" height="1540" fill="#f5f7fb"/>
  <rect x="48" y="42" width="1704" height="1456" rx="30" fill="white" filter="url(#shadow)"/>

  <text x="92" y="112" class="title">2027학년도 연기과 입시 시험 일정</text>
  <text x="92" y="153" class="subtitle">지원 확정 8교 · 수시 6장 선택 완료 · 2026년 8월–11월</text>

  <rect x="92" y="183" width="1616" height="82" rx="18" fill="#fff0ec" stroke="#f1b5a8" stroke-width="2"/>
  <circle cx="130" cy="224" r="19" fill="#e65f5c"/>
  <text x="165" y="218" class="note" fill="#9a302c">나의 다음 시험  ·  한국예술종합학교 1차</text>
  <text x="165" y="246" font-size="24" font-weight="800" fill="#9a302c">8월 19일(수) · 대기실 입실 마감 15시 30분</text>
  <rect x="930" y="199" width="750" height="49" rx="14" fill="#eaf8ef" stroke="#9fd6b0" stroke-width="2"/>
  <text x="946" y="231" font-size="16" font-weight="800" fill="#287a46">확정 8교 · 한예종 · 가천 · 동국 · 세종 · 국민 · 성균관 · 서울예대 · 건국</text>

  <!-- month background -->
  <rect x="365" y="300" width="194" height="900" fill="#faf3ee"/>
  <rect x="559" y="300" width="448" height="900" fill="#f5f8ff"/>
  <rect x="1007" y="300" width="463" height="900" fill="#f7f5ff"/>
  <rect x="1470" y="300" width="210" height="900" fill="#f1faf7"/>

  <text x="462" y="332" text-anchor="middle" class="month">8월</text>
  <text x="783" y="332" text-anchor="middle" class="month">9월</text>
  <text x="1238" y="332" text-anchor="middle" class="month">10월</text>
  <text x="1575" y="332" text-anchor="middle" class="month">11월</text>

