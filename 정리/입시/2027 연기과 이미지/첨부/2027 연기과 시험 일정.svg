<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380">
  <defs>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #182033; }
      .title { font-size: 46px; font-weight: 800; }
      .subtitle { font-size: 20px; fill: #667086; }
      .school { font-size: 27px; font-weight: 800; }
      .stage { font-size: 17px; font-weight: 800; fill: #ffffff; }
      .date { font-size: 25px; font-weight: 800; }
      .detail { font-size: 18px; fill: #687287; }
      .overlap-date { font-size: 21px; font-weight: 800; }
      .overlap-text { font-size: 17px; fill: #4f596d; }
      .legend { font-size: 18px; fill: #596378; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1b2942" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7bfce"/>
    </marker>
  </defs>

  <rect width="1800" height="1380" fill="#f3f6fb"/>
  <rect x="38" y="34" width="1724" height="1312" rx="30" fill="#ffffff" filter="url(#shadow)"/>

  <!-- header -->
  <text x="82" y="104" class="title">2027학년도 연기과 입시 시험 일정</text>
  <text x="82" y="143" class="subtitle">학교별 1차 → 2차 흐름 · 지원 확정 8교</text>
  <rect x="1080" y="66" width="622" height="78" rx="18" fill="#edf8f1" stroke="#a5d8b5" stroke-width="2"/>
  <text x="1110" y="98" font-size="19" font-weight="800" fill="#267545">수시 6장 확정 완료</text>
  <text x="1110" y="126" font-size="18" fill="#267545">가천 · 동국 · 세종 · 국민 · 성균관 · 건국</text>

  <!-- next exam -->
  <rect x="82" y="174" width="1620" height="96" rx="20" fill="#fff0ed" stroke="#f1a99f" stroke-width="2"/>
