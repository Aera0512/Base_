  <rect x="365" y="374" width="36" height="30" rx="8" fill="#e65f5c"/>
  <text x="411" y="396" font-size="17" font-weight="800" fill="#9a302c">08/19 · 개인 확정</text>

  <rect x="798" y="416" width="90" height="30" rx="8" fill="#E45757"/>
  <text x="843" y="438" text-anchor="middle" class="date" style="fill:#ffffff">09/17–22</text>
  <rect x="813" y="458" width="75" height="30" rx="8" fill="#E45757"/>
